services:
  orcaterm2api:
    build: .
    image: orcaterm2api:latest
    container_name: orcaterm2api
    ports:
      - "8317:8317"
    environment:
      - TZ=Asia/Shanghai
      - ORCATERM2API_MGMT_KEY=${ORCATERM2API_MGMT_KEY:-}
      - ORCATERM2API_ALLOW_REMOTE=${ORCATERM2API_ALLOW_REMOTE:-0}
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./state:/app/state
    restart: unless-stopped
